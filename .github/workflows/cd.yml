name: CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML
        run: npx html-validate index.html

      - name: Validate JavaScript
        run: node --check script.js

      - name: Validate CSS
        run: npx stylelint styles.css


  deploy:
    name: Deploy to AWS
    needs: validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::210948569690:role/PokeDex-GitHubActions-Deploy
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application to S3
        run: |
          aws s3 sync . s3://pokedex-frontend-rahul-dev \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infrastructure/*" \
            --exclude "node_modules/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3I6YX6DBLZDZJ \
            --paths "/*"

      - name: Deployment completed
        run: echo "PokeDex deployment completed successfully."